name: Visual Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'extension/popup.html'
      - 'extension/popup.js'
      - 'extension/popup-base.css'
      - 'tests/visual-check.js'
  workflow_dispatch:

jobs:
  visual:
    name: Playwright screenshots
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Tailwind build (popup.css gerado)
        run: npm run build

      - name: Run visual check
        run: npm run visual

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-screenshots
          path: tests/visual/latest/
          retention-days: 14
